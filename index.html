<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>호흡 가이드 타이머</title>
    <link rel="stylesheet" href="style.css">
    <!-- 모바일 드래그 앤 드롭을 위한 가벼운 라이브러리 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>숨 타이머 ☁️</h1>

        <!-- 첫 번째 화면: 설정 화면 -->
        <div id="setup-screen" class="screen active">
            
            <!-- 🚀 추가된 부분: 타이틀과 시간 설정 사이의 프리셋 영역 -->
            <div class="preset-header">
                <span class="section-title">호흡 설정</span>
                <button id="preset-btn" class="preset-btn">프리셋 불러오기</button>
            </div>

            <!-- 첫 번째 박스: 호흡 순서 및 시간 설정 -->
            <div class="settings-group" id="phase-list">
                <!-- data-phase 속성으로 자바스크립트가 순서를 읽어갑니다 -->
                <div class="input-group draggable-item" data-phase="exhale">
                    <label>
                        <div class="label-left">
                            <span class="drag-handle">≡</span>
                            <span>내쉬기 (입)</span>
                        </div>
                        <input type="number" id="exhale-time" value="10" min="1">
                    </label>
                </div>
                <div class="input-group draggable-item" data-phase="hold">
                    <label>
                        <div class="label-left">
                            <span class="drag-handle">≡</span>
                            <span>숨 참기</span>
                        </div>
                        <input type="number" id="hold-time" value="2" min="0">
                    </label>
                </div>
                <div class="input-group draggable-item" data-phase="inhale">
                    <label>
                        <div class="label-left">
                            <span class="drag-handle">≡</span>
                            <span>들이마시기 (코)</span>
                        </div>
                        <input type="number" id="inhale-time" value="5" min="1">
                    </label>
                </div>
            </div>

            <div class="preset-header">
                <span class="section-title">세트 설정</span>
            </div>

            <!-- 두 번째 박스: 세트 및 반복 설정 -->
            <div class="settings-group">
                <div class="input-group">
                    <label>
                        <div class="label-left">
                            <span class="icon-spacer"></span> <!-- 줄맞춤용 빈 공간 -->
                            <span>1세트당 횟수</span>
                        </div>
                        <input type="number" id="reps-per-set" value="5" min="1">
                    </label>
                </div>
                <div class="input-group">
                    <label>
                        <div class="label-left">
                            <span class="icon-spacer"></span>
                            <span>총 세트</span>
                        </div>
                        <input type="number" id="total-sets" value="3" min="1">
                    </label>
                </div>
            </div>

            <button id="go-to-timer-btn" class="main-btn">호흡 시작하기</button>
        </div>

        <!-- 두 번째 화면: 타이머 화면 -->
        <div id="timer-screen" class="screen">
            <div class="timer-display">
                <h2 id="phase-text">준비</h2>
                <div id="time-left">0</div>
                <div class="progress-info">
                    <span>회차: <span id="current-rep">0</span> / <span id="total-reps-display">5</span></span>
                    <br>
                    <span>세트: <span id="current-set">0</span> / <span id="total-sets-display">3</span></span>
                </div>
            </div>

            <div class="controls">
                <button id="stop-btn">정지</button>
                <button id="back-btn">설정으로</button>
            </div>
        </div>
    </div>

    <!-- 🚀 프리셋 선택 모달창 -->
    <div id="preset-modal" class="modal">
        <div class="modal-content">
            <h3>프리셋 목록</h3>
            <div class="preset-list">
                <button class="preset-item" data-preset="478">4-7-8 호흡법</button>
                <button class="preset-item" data-preset="1025">10-2-5 호흡법</button>
            </div>
            <button id="close-modal-btn" class="close-modal-btn">닫기</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
