<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>호흡 가이드 타이머</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>숨 타이머</h1>

        <!-- 첫 번째 화면: 설정 화면 -->
        <div id="setup-screen" class="screen active">
            <div class="settings">
                <div class="input-group">
                    <label>내쉬기 (초) <input type="number" id="exhale-time" value="10" min="1"></label>
                </div>
                <div class="input-group">
                    <label>숨 참기 (초) <input type="number" id="hold-time" value="2" min="0"></label>
                </div>
                <div class="input-group">
                    <label>들이마시기 (초) <input type="number" id="inhale-time" value="5" min="1"></label>
                </div>
                <div class="input-group">
                    <label>1세트당 횟수 <input type="number" id="reps-per-set" value="5" min="1"></label>
                </div>
                <div class="input-group">
                    <label>총 세트 <input type="number" id="total-sets" value="3" min="1"></label>
                </div>
            </div>
            <button id="go-to-timer-btn" class="main-btn">호흡 시작하기</button>
        </div>

        <!-- 두 번째 화면: 타이머 화면 -->
        <div id="timer-screen" class="screen">
            <div class="timer-display">
                <h2 id="phase-text">준비</h2>
                <div id="time-left">0</div>
                <div class="progress-info">
                    <span>회차: <span id="current-rep">0</span> / <span id="total-reps-display">5</span></span>
                    <br>
                    <span>세트: <span id="current-set">0</span> / <span id="total-sets-display">3</span></span>
                </div>
            </div>

            <!-- 컨트롤 버튼 -->
            <div class="controls">
                <button id="stop-btn">정지</button>
                <button id="back-btn">설정으로</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
